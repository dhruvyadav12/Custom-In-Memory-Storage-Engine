name: C++ Storage Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake g++ python3

    - name: Configure CMake
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release

    - name: Build All Targets
      run: |
        cd build
        make -j$(nproc)

    - name: Run C++ Unit Tests (CTest)
      run: |
        cd build
        ctest --output-on-failure --verbose

    - name: Run Live TCP Integration & Benchmark Tests
      run: |
        # Start server in background
        ./build/storage_server --port 6389 --threads 4 &
        SERVER_PID=$!
        sleep 2

        # Run Python integration test
        python3 tests/test_integration.py

        # Run C++ concurrent benchmark
        ./build/bench_storage --port 6389 -c 10 -n 1000 -t SET
        ./build/bench_storage --port 6389 -c 10 -n 1000 -t GET
        ./build/bench_storage --port 6389 -c 10 -n 1000 -t ZADD

        # Kill server
        kill -SIGINT $SERVER_PID
        wait $SERVER_PID || true
