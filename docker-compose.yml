version: '3.8'

services:
  storage-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: custom_storage_engine
    ports:
      - "6379:6379"
    volumes:
      - storage_data:/app/data
    command: ["--host", "0.0.0.0", "--port", "6379", "--threads", "4", "--dump", "/app/data/dump.tlv"]
    restart: unless-stopped

volumes:
  storage_data:
